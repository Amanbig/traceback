name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # -------------------------------------------------------------
  # Job 1: Build Android Release (APK & AAB)
  # -------------------------------------------------------------
  build-android:
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Validate Tag Matches App Version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          echo "Git Tag Version: $TAG_VERSION"
          echo "App Version (pubspec.yaml): $APP_VERSION"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match app version in pubspec.yaml ($APP_VERSION)!"
            echo "Please update the 'version:' field in pubspec.yaml to match the release tag."
            exit 1
          fi
          echo "✓ Git tag matches pubspec.yaml version successfully ($TAG_VERSION)."

      - name: Decode Android Keystore (If Secrets Present)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore..."
            mkdir -p android/app
            echo "$KEYSTORE_BASE64" | tr -d '\r\n ' | base64 -d > android/app/traceback-release.jks || python3 -c "import base64, os; open('android/app/traceback-release.jks', 'wb').write(base64.b64decode(os.environ['KEYSTORE_BASE64'].strip()))"
            cat <<EOF > android/key.properties
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=traceback-release.jks
          EOF
            echo "✓ Release keystore and android/key.properties ready."
          else
            echo "No keystore secret provided. Building with default signing."
          fi

      - name: Build Android APK
        run: flutter build apk --release --build-name="${GITHUB_REF_NAME#v}" --build-number="${{ github.run_number }}"

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release --build-name="${GITHUB_REF_NAME#v}" --build-number="${{ github.run_number }}"

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceback-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Android AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceback-android-aab
          path: build/app/outputs/bundle/release/app-release.aab

  # -------------------------------------------------------------
  # Job 2: Build iOS Bundle (macOS Runner, Unsigned / Release)
  # -------------------------------------------------------------
  build-ios:
    name: Build iOS Bundle
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS (No Codesign)
        run: flutter build ios --release --no-codesign --build-name="${GITHUB_REF_NAME#v}" --build-number="${{ github.run_number }}"

      - name: Package iOS App Archive
        run: |
          cd build/ios/iphoneos
          zip -r ../../../traceback-ios-unsigned.zip Runner.app
          cd ../../..

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceback-ios
          path: traceback-ios-unsigned.zip

  # -------------------------------------------------------------
  # Job 3: Build Web Release
  # -------------------------------------------------------------
  build-web:
    name: Build Web Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release

      - name: Package Web Archive
        run: |
          cd build/web
          zip -r ../../traceback-web.zip .
          cd ../..

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: traceback-web
          path: traceback-web.zip

  # -------------------------------------------------------------
  # Job 4: Create GitHub Release with All Artifacts
  # -------------------------------------------------------------
  release:
    name: Publish GitHub Release
    needs: [build-android, build-ios, build-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Prepare Artifacts for Distribution
        run: |
          cd release-artifacts
          [ -f app-release.apk ] && mv app-release.apk traceback-${{ github.ref_name }}-android.apk
          [ -f app-release.aab ] && mv app-release.aab traceback-${{ github.ref_name }}-android.aab
          [ -f traceback-ios-unsigned.zip ] && mv traceback-ios-unsigned.zip traceback-${{ github.ref_name }}-ios.zip
          [ -f traceback-web.zip ] && mv traceback-web.zip traceback-${{ github.ref_name }}-web.zip
          ls -la

      - name: Extract Release Notes
        id: notes
        run: |
          TAG="${{ github.ref_name }}"
          NOTE_FILE="release_notes/${TAG}.md"
          if [ -f "$NOTE_FILE" ]; then
            echo "Found matching release note: $NOTE_FILE"
            echo "path=$NOTE_FILE" >> $GITHUB_OUTPUT
          else
            echo "No specific file found; using main RELEASE_NOTES.md"
            echo "path=RELEASE_NOTES.md" >> $GITHUB_OUTPUT
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Traceback ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: release-artifacts/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
