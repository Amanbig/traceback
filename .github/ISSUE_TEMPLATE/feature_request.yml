name: Feature request
description: Suggest an idea or enhancement for Traceback
labels: ["enhancement"]
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Problem & Feature Suggestion
      description: What fraud vector or user experience would this feature address?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Implementation
      description: How should this work on-device vs in cloud AI?
