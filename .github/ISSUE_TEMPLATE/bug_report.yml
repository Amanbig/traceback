name: Bug report
description: Create a report to help us improve Traceback
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug! Please ensure no real PII is pasted in this issue.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
    validations:
      required: true
  - type: input
    id: device-info
    attributes:
      label: Environment / Device
      description: e.g. Web (Chrome 128), Android (Pixel 8, Android 15), iOS 18
